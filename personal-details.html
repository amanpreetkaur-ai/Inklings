<!DOCTYPE html>
<html lang="en">
    
    <head>

        <title>Inklings</title>
        <meta name="description" content="">
<!--CSS Link-->
        <link rel="stylesheet" href="personal-details.css">
<!--Icon CDN Link-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <body>
        <nav class="navbar">
            <div class="logo"><a style="text-decoration: none; color: white;" href="Index.html">Inklings</a></div>
        </nav>
    <div class="liquid-bg"></div>
    <main>
        <div class="personal-details">

    <h2>Writer's Details</h2>

    <form action="writing.html">

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">

        <label for="penname">Pen Name (Optional)</label>
        <input type="text" id="penname" name="penname" placeholder="Enter your pen name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">


        <label for="city">Place</label>
        <input type="text" id="place" name="place" placeholder="Enter your city">

        <label for="bio">Short Author Bio</label>
        <textarea id="bio" name="bio" rows="5"
        placeholder="Tell readers a little about yourself..."></textarea>


        <button type="submit">Next</button>

    </form>
        </div>
    </main>
