<!DOCTYPE html>
<html>
    <head>
        <title>Signup</title>
         <link rel="stylesheet" href="registration.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo"><a style="text-decoration: none; color: white;" href="Index.html">Inklings</a></div>
        </nav>
        <div class="liquid-bg"></div>
    <main>
        <div class="signup-container">

            <h1>Join Inklings</h1>

            <form>

                <label>Name</label>
                <input type="text" name="name" placeholder="Enter your name">

                <label>Age</label>
                <input type="number" name="age" placeholder="Enter your age">

                <label>Mobile Number</label>
                <input type="tel" name="mobile-number" placeholder="Enter your number">

                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password">

                <button type="submit">Sign Up</button>

            </form>

        </div>
    </main>
    <footer>
        <div><p>&copy; 2026 The Three Musketeers Co.<br>All rights reserved.</p></div>
    </footer>
</body>
</html>
