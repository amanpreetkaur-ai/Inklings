<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Metro UI</title>
  <link rel="stylesheet" href="Exstyles.css">
</head>
<body>

  <div class="liquid-bg"></div>

  <main class="metro-container">
    
    <div class="tile-wrapper tile-wide delay-1">
      <div class="tile-glass tint-cyan">
        <span class="tile-title">Dashboard</span>
        <div class="sub-tiles">
          <div class="mini-box"></div>
          <div class="mini-box"></div>
          <div class="mini-box"></div>
          <div class="mini-box"></div>
          </div>
      </div>
    </div>

    <div class="tile-wrapper tile-square delay-2">
      <div class="tile-glass tint-magenta">
        <span class="tile-title">Projects</span>
      </div>
    </div>
    
    <div class="tile-wrapper tile-square delay-3">
      <div class="tile-glass tint-orange">
        <span class="tile-title">Analytics</span>
      </div>
    </div>

    <div class="tile-wrapper tile-large delay-4">
      <div class="tile-glass tint-green">
        <span class="tile-title">Live Feed</span>
      </div>
    </div>

    <div class="tile-wrapper tile-square delay-5">
      <div class="tile-glass tint-purple">
        <span class="tile-title">Settings</span>
      </div>
    </div>
    
    <div class="tile-wrapper tile-square delay-1">
      <div class="tile-glass tint-blue">
        <span class="tile-title">Profile</span>
      </div>
    </div>

  </main>

</body>
</html>
