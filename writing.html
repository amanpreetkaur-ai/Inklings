<!DOCTYPE html>
<html lang="en">
    
    <head>

        <title>Inklings</title>
        <meta name="description" content="">
<!--CSS Link-->
        <link rel="stylesheet" href="writing.css">
<!--Icon CDN Link-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<!--Font CDN Link-->
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    
    </head>
    <body>
        <nav class="navbar">
            <div class="logo"><a style="text-decoration: none; color: white;" href="Index.html">Inklings</a></div>
        </nav>
    <div class="liquid-bg"></div>
    <main>

<div class="content-details">

    <h2>Content Details</h2>

    <form action="success.html" method="post">

        <!-- Title -->
        <label for="title">Title of the Work</label>
        <input type="text" id="title" name="title" placeholder="Enter your work title" required>

        <!-- Category -->
        <label for="genre">Genre</label>
        <select id="genre" name="category" required>
            <option value="">-- Select Genre --</option>
            <option>Fiction</option>
            <option>Non-Fiction</option>
            <option>Poetry</option>
            <option>Short Story</option>
            <option>Novel</option>
            <option>Essay</option>
            <option>Children's Literature</option>
        </select>


        <!-- Language -->
        <label for="language">Language</label>
        <select id="language" name="language" required>
            <option value="">-- Select Language --</option>
            <option>English</option>
            <option>Hindi</option>
            <option>Urdu</option>
            <option>Punjabi</option>
            <option>Bangla</option>
            <option>French</option>
            <option>Spanish</option>
        </select>

        <!-- Synopsis -->
        <label for="synopsis">Short Synopsis</label>
        <textarea id="synopsis" name="synopsis" rows="5"
        placeholder="Write a brief summary of your work..." required></textarea>

        <!-- Keywords -->
        <label for="keywords">Keywords / Tags</label>
        <input type="text" id="keywords" name="keywords"
        placeholder="Romance, College, Mystery">

        <hr>

        <h3>Upload Your Work</h3>

        <!-- Upload Manuscript -->

<label for="manuscript">Upload Manuscript (.docx / .pdf)</label>

<input type="file" id="manuscript" accept=".doc,.docx,.pdf">

<label for="manuscript" class="upload-btn">
    📄 Choose Manuscript
</label>

<span id="manuscript-name">No file selected</span>

<br>

<!-- Cover Image -->

<label for="cover">Cover Image (Optional)</label>

<input type="file" id="cover" accept="image/*">

<label for="cover" class="upload-btn">
    🖼️ Choose Cover Image
</label>

<span id="cover-name">No file selected</span>

        <!-- Status -->
        <label>Status</label>

        <div class="radio-group">
            <input type="radio" id="complete" name="status" value="Complete" required>
            <label for="complete">Complete</label>

            <input type="radio" id="ongoing" name="status" value="Ongoing">
            <label for="ongoing">Ongoing</label>
        </div>

        <hr>

        <h3>Declaration</h3>

<div class="checkbox-group">

    <div class="check-item">
        <input type="checkbox" id="original" required>
        <label for="original">I confirm this is my original work.</label>
    </div>

    <div class="check-item">
        <input type="checkbox" id="permission" required>
        <label for="permission">
            I grant Inkling's Exclusive permission to review and publish my work.
        </label>
    </div>

    <div class="check-item">
        <input type="checkbox" id="terms" required>
        <label for="terms">
            I agree to the Terms & Conditions and Privacy Policy.
        </label>
    </div>

</div>

        <hr>

        <h3>Publishing Preference (Optional)</h3>

        <label for="publish-type">Choose an Option</label>
        <select id="publish-type" name="publish-type">
            <option>Free</option>
            <option>Premium</option>
        </select>

        <hr>

        <h3>Social Links (Optional)</h3>

        <label for="instagram">Instagram</label>
        <input type="url" id="instagram" name="instagram"
        placeholder="https://instagram.com/username">

        <label for="website">Website / Portfolio</label>
        <input type="url" id="website" name="website"
        placeholder="https://yourwebsite.com">

        <hr>

        <h3>Additional Information</h3>

        <label for="reason">
            Why do you want to publish on Inkling's?
        </label>
        <textarea id="reason" name="reason" rows="4"
        placeholder="Tell us your motivation..."></textarea>

        <label>Have you published before?</label>

        <div class="radio-group">
            <input type="radio" id="yes" name="published" value="Yes">
            <label for="yes">Yes</label>

            <input type="radio" id="no" name="published" value="No">
            <label for="no">No</label>
        </div>

        <br>

        <button type="submit">Submit</button>

    </form>

</div>
    </main>
    <footer>
        <div><p>&copy; 2026 The Three Musketeers Co.<br>All rights reserved.</p></div>
    </footer>
    </body>
</html>
